name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python files
        run: python -m compileall app.py db.py model.py

      - name: Build SQLite database from CSV
        run: python db.py

      - name: Train model smoke test
        run: python model.py

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest
          else
            echo "No tests directory yet; skipping pytest."
          fi
